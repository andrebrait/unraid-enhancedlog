on:
  release:
    types:
      - prereleased
      - released

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Fork of dkaser/unraid-plugin-release-action with pinned nested actions.
      - uses: andrebrait/unraid-plugin-release-action@f8b9ca20317d0c3fa29d01cf7d5de257bcd00533
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          composer_dir: "src/usr/local/php/unraid-enhancedlog/"
