on:
  release:
    types:
      - prereleased
      - released

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/unraid-plugin-release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          composer_dir: "src/usr/local/php/unraid-enhancedlog/"
